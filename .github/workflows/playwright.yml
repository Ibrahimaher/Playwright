name: Playwright Tests leo

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      test-to-run:
        description: 'Add your npx code'
        required: false
        default: 'npx playwright test'
        type: string 
      workers:
        description: 'Number of workers to run tests in parallel'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      browsers:
        description: 'Browsers to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - 'chromium'
          - 'firefox'
          - 'webkit'

jobs:
  # الـ Job الأولى: تشغيل التستات
  run-playwright-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: |
        TEST_CMD="${{ github.event.inputs.test-to-run || 'npx playwright test' }}"
        WORKERS="${{ github.event.inputs.workers || '1' }}"
        PROJECT="${{ github.event.inputs.browsers || 'chromium' }}"
        $TEST_CMD --workers=$WORKERS --project=$PROJECT || npm run generate:reports

    - name: upload playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: upload allure report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-test-report
        path: test-results/
        retention-days: 30

  # الـ Job الثانية: فحص الثغرات (تعتمد على الأولى)
  run-snyk-scan:
    needs: run-playwright-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # الـ Job الثالثة: فحص الأمان ZAP (تعتمد على الأولى أيضاً)
  run-zap-scan:
    needs: run-playwright-test
    runs-on: ubuntu-latest
    steps:
    - name: ZAP Scan
      uses: zaproxy/action-full-scan@v0.13.0
      with:
        target: 'https://www.saucedemo.com/'