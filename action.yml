name: Install Playwright browsers
description: Cache Playwright browser binaries and install them on a cache miss
inputs:
  cache-key:
    description: Additional value used to invalidate the browser cache
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ inputs.cache-key }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps
